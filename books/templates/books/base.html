{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>The Book Nook</title>
    <link rel="shortcut icon" type="image/png" href="{% static 'favicon.ico' %}"/>
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <script src="{% static 'tagify/tagify.js' %}"></script>
    <link href="{% static 'tagify/tagify.css' %}" rel="stylesheet" type="text/css" />
</head>
<body>
    <nav style="height:3.5rem; padding-right:0; padding-left:1rem">
        <a class="left" href="{% url 'home' %}" style="font-weight: bold; font-size: 1.5rem; margin-top:-0.4rem">📚</a>
        {% if user.is_authenticated %}
            <a class="left"href="{% url 'my_library' %}"><b>My Library</b></a>
            <form class="right" method="post" action="{% url 'logout' %}" style="border:5px purple">
                {% csrf_token %}
                <button class="a" type="submit"><b>➜]</b></button>
            </form>
            <a class="right" href="{% url 'edit_profile' %}"><b>⚙︎</b></a>
            <a class="right" href="{% url 'profile' user.username %}"><b>{{ user.username }}</b></a>
        {% else %}
            <a class="right" href="{% url 'login' %}"><b>Login</b></a>
            <a class="right" href="{% url 'signup' %}"><b>Sign Up</b></a>
        {% endif %}
    </nav>

    <div class="container">
        {% if messages %}
            {% for message in messages %}
                <div class="success">{{ message }}</div>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </div>
</body>
</html>
